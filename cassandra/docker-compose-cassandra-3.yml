# Cassandra 3-node ring: cass1 (seed), cass2, cass3. Masterless; keyspace ycsb uses RF=3.
# External network tp2-net is created by run_cassandra.sh (or: docker network create tp2-net).
#
# Nodes start one at a time (depends_on: service_healthy): Cassandra refuses concurrent
# bootstraps, and starting every node at once on one machine makes the ring flap.
#
# Per-node limits (same values for every DB, see top-level README): 2 CPUs, 2 GB RAM.
# Override for local debugging only: NODE_CPUS=1 NODE_MEM=1500m docker compose ... up -d
networks:
  tp2-net:
    external: true

x-cass-node: &cass-node
  image: cassandra:5.0.9
  networks: [tp2-net]
  cpus: ${NODE_CPUS:-2}
  mem_limit: ${NODE_MEM:-2g}
  # auto_snapshot=false: otherwise every TRUNCATE between reps writes a snapshot
  # of the table to disk (10 reps x 6 workloads -> fills the disk).
  # The entrypoint then applies the CASSANDRA_* env vars below and starts cassandra -f.
  entrypoint: ["bash", "-c", "sed -i 's/^auto_snapshot: true/auto_snapshot: false/' /etc/cassandra/cassandra.yaml && exec docker-entrypoint.sh cassandra -f"]
  environment:
    CASSANDRA_CLUSTER_NAME: tp2
    CASSANDRA_SEEDS: cass1
    CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    CASSANDRA_DC: DC1
    CASSANDRA_RACK: RAC1
    # Fixed heap: by default the JVM heap is sized from *host* RAM (~3.75 GB per node
    # on a 15 GB WSL2 VM), which does not fit in the 2 GB container limit.
    MAX_HEAP_SIZE: 1G
    HEAP_NEWSIZE: 256M
  healthcheck:
    # Healthy = CQL port is accepting clients (node finished joining the ring).
    test: ["CMD-SHELL", "nodetool info 2>/dev/null | grep -q 'Native Transport active *: true'"]
    interval: 10s
    timeout: 20s
    retries: 30
    start_period: 60s

services:
  cass1:
    <<: *cass-node
    container_name: cass1
    hostname: cass1

  cass2:
    <<: *cass-node
    container_name: cass2
    hostname: cass2
    depends_on:
      cass1: {condition: service_healthy}

  cass3:
    <<: *cass-node
    container_name: cass3
    hostname: cass3
    depends_on:
      cass2: {condition: service_healthy}
