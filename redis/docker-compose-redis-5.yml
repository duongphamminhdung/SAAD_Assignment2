# Redis 5-node topology: redis1 = master, redis2..redis5 = replicas.
networks:
  tp2-net:
    external: true

# Team decision (2026-11-18): every DB container in this project is capped at
# 2 CPUs / 2 GB RAM (deploy.resources.limits) — same limits for all 3 databases.
services:
  redis1:
    image: redis:7.4
    container_name: redis1
    command: ["redis-server", "--protected-mode", "no", "--save", "", "--appendonly", "no"]
    networks: [tp2-net]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  redis2:
    image: redis:7.4
    container_name: redis2
    command: ["redis-server", "--protected-mode", "no", "--save", "", "--appendonly", "no",
              "--replicaof", "redis1", "6379"]
    networks: [tp2-net]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  redis3:
    image: redis:7.4
    container_name: redis3
    command: ["redis-server", "--protected-mode", "no", "--save", "", "--appendonly", "no",
              "--replicaof", "redis1", "6379"]
    networks: [tp2-net]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  redis4:
    image: redis:7.4
    container_name: redis4
    command: ["redis-server", "--protected-mode", "no", "--save", "", "--appendonly", "no",
              "--replicaof", "redis1", "6379"]
    networks: [tp2-net]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  redis5:
    image: redis:7.4
    container_name: redis5
    command: ["redis-server", "--protected-mode", "no", "--save", "", "--appendonly", "no",
              "--replicaof", "redis1", "6379"]
    networks: [tp2-net]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
