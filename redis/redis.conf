# redis.conf — TP2 benchmark configuration
# The benchmark containers are launched with CLI flags equivalent to this file:
#   master  (redis1): redis-server --protected-mode no --save "" --appendonly no
#   replica (redis2..redisN): same, plus --replicaof redis1 6379
# This file is kept for the TP2 config archive submission.

# Accept connections from other containers on tp2-net (no password set on the
# isolated benchmark network).
protected-mode no

# Disable RDB snapshotting: default save rules can trigger BGSAVE during a
# benchmark; the fork would add latency noise unrelated to the workload.
save ""

# Disable AOF persistence: benchmark data is disposable (wiped every rep).
appendonly no

# --- replicas only (redis2..redisN) ---
# replicaof redis1 6379
